<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdBridge AI – Operator Redirect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg, #f8fafc); font-family: system-ui, -apple-system, sans-serif;">
    <div style="text-align: center; padding: 2rem; background: var(--surface, #ffffff); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border, #e2e8f0); max-width: 400px;">
        <h2 style="margin-bottom: 0.5rem; font-size: 1.25rem;">❄️ ColdBridge AI</h2>
        <p style="color: var(--text-muted, #64748b); font-size: 0.95rem; margin-bottom: 1rem;">Redirecting to your dedicated operator panel...</p>
        <div style="display: inline-block; width: 24px; height: 24px; border: 3px solid #cbd5e1; border-top-color: #0284c7; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module">
        import { getMe, redirectByRole } from './js/auth.js';
        (async () => {
            try {
                const user = await getMe();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                redirectByRole(user);
            } catch (err) {
                console.error('Redirect failed:', err);
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>
</html>
