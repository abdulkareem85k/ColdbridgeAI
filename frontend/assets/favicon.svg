<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0b3d1e"/>
  <!-- Arch / Bridge Base -->
  <path d="M4 25 C10 18, 22 18, 28 25" fill="none" stroke="#b8975a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Central Cold Snowflake Stem -->
