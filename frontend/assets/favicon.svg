  <line x1="10" y1="12" x2="22" y2="12" stroke="#faf8f3" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Snowflake Diagonal Crossbars -->
  <line x1="11.5" y1="8" x2="20.5" y2="17" stroke="#b8975a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="20.5" y1="8" x2="11.5" y2="17" stroke="#b8975a" stroke-width="1.4" stroke-linecap="round"/>
